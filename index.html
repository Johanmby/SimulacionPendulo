<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Péndulo de Newton v5</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #1a1a2e;
    --bg2: #16213e;
    --bg3: #0f3460;
    --accent: #e94560;
    --accent2: #f5a623;
    --text: #eaeaea;
    --text2: #a0a8c0;
    --border: rgba(255,255,255,0.10);
    --radius: 12px;
    --font: 'Segoe UI', system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    padding: 18px;
    min-height: 100vh;
  }
  h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--accent);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h1 span { color: var(--text2); font-weight: 400; font-size: 13px; }

  #wrap {
    background: #1e2240;
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  #pc { display: block; width: 100%; cursor: grab; }
  #pc.dragging { cursor: grabbing; }

  .panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .panel-title {
    font-size: 10px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 10px;
  }

  /* Fila de controles por bola */
  #ctrlrow {
    display: flex;
    align-items: center;
    gap: 0;
    flex-wrap: wrap;
    gap: 4px;
  }
  .bctl {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .bctl .lbl {
    font-size: 9px;
    color: var(--text2);
    text-align: center;
    white-space: nowrap;
  }
  .bctl input[type=range] { width: 60px; }
  .vsep {
    width: 1px;
    height: 40px;
    background: var(--border);
    margin: 0 8px;
  }
  .chklbl {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
  }
  .chklbl input { accent-color: var(--accent); }

  /* Fila de botones */
  .btn-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  button {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 12px;
    font-family: var(--font);
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  button:hover { background: #1a4a80; border-color: rgba(255,255,255,0.2); }
  button#startBtn { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  button#startBtn:hover { background: #c73a50; }

  select {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    font-family: var(--font);
    cursor: pointer;
  }
  label { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 6px; }

  /* Gráfica */
  #gc { display: block; width: 100%; }
  .leg {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .li { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text2); }
  .li span { width: 18px; height: 2px; border-radius: 2px; display: inline-block; }

  /* Selector N */
  .n-selector {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text2);
  }
  .n-btn {
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700;
    padding: 0;
    line-height: 1;
  }
  #nDisplay {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    min-width: 18px;
    text-align: center;
  }
</style>
</head>
<body>
<h1>⚫ Péndulo de Newton <span>simulación física</span></h1>

<div id="wrap"><canvas id="pc" width="660" height="360"></canvas></div>

<div class="panel">
  <div class="panel-title">Configuración de bolas</div>
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div class="n-selector">
      Bolas:
      <button class="n-btn" id="nMinus">−</button>
      <span id="nDisplay">5</span>
      <button class="n-btn" id="nPlus">+</button>
    </div>
    <div class="vsep" style="height:28px"></div>
    <div id="ctrlrow" style="display:flex;align-items:center;gap:4px;flex-wrap:wrap"></div>
    <div class="vsep" style="height:28px"></div>
    <label class="chklbl"><input type="checkbox" id="noFric"> Sin fricción</label>
  </div>
</div>

<div class="btn-row">
  <button id="startBtn" onclick="simStart()">▶ Iniciar</button>
  <button onclick="simReset()">↺ Reiniciar</button>
  <label>Velocidad:
    <select id="spd">
      <option value="1">1×</option>
      <option value="2">2×</option>
      <option value="4" selected>4×</option>
    </select>
  </label>
  <button onclick="exportExcel()" style="margin-left:auto">⬇ Exportar Excel</button>
</div>

<div class="panel">
  <div class="panel-title">Energía del sistema</div>
  <canvas id="gc" width="640" height="160"></canvas>
  <div class="leg">
    <div class="li"><span style="background:#f59e0b"></span>Cinética total</div>
    <div class="li"><span style="background:#60a5fa"></span>Potencial total</div>
    <div class="li"><span style="background:#a78bfa"></span>Mecánica total</div>
    <div class="li"><span style="background:#94a3b8"></span>Disipada acum.</div>
  </div>
</div>

<script>
(function(){
  const cv  = document.getElementById('pc');
  const ctx  = cv.getContext('2d');
  const W = 660, H = 360;
  const GC   = document.getElementById('gc');
  const gctx = GC.getContext('2d');

  // ── Paleta de colores para hasta 8 bolas ──
  const ALL_COLORS = ['#e84040','#e8a020','#40b840','#4060e8','#a030cc','#20c8c8','#e860a0','#888888'];
  const ALL_NAMES  = ['Roja','Naranja','Verde','Azul','Morada','Cyan','Rosa','Gris'];

  let N = 5;
  const MIN_N = 2, MAX_N = 8;

  const MIN_R = 14, MAX_R = 40;
  let RADII    = Array(MAX_N).fill(28);
  let FRICTIONS = Array(MAX_N).fill(0.05);

  const V_HALF  = 14;
  const G_PHYS  = 9.81, SL = 1.0;
  const ST = 0.012, SO = 0.018;

  const BAR_BACK_Y  = 28, BAR_FRONT_Y = 42, BAR_H = 10;
  const ANCH_Y  = BAR_FRONT_Y + BAR_H;
  const STR_LEN = 200;
  const REST_Y  = ANCH_Y + STR_LEN;

  let histTime=[], histEk=[], histEp=[], histEt=[], histEd=[];
  let simTime = 0;
  let run = false, aid, lts;
  let ps = [];

  // ── Centros X según N y radios actuales ──
  function calcBX() {
    const bx = [];
    const radii = RADII.slice(0, N);
    let totalW = 0;
    for (let i = 0; i < N; i++) totalW += radii[i] * 2;
    totalW += (N - 1) * 1;
    let x = W / 2 - totalW / 2 + radii[0];
    for (let i = 0; i < N; i++) {
      bx.push(x);
      if (i < N - 1) x += radii[i] + radii[i + 1] + 1;
    }
    return bx;
  }

  function mkBall(i) {
    return {
      theta: 0, omega: 0,
      mass: Math.pow(RADII[i] / 28, 3),
      friction: FRICTIONS[i],
      time: 0, stopped: false, stoppedTime: null,
      ediss: 0, collCD: 0, noFric: false
    };
  }
  function mk() { return Array.from({length: N}, (_, i) => mkBall(i)); }
  function resetHist() { histTime=[]; histEk=[]; histEp=[]; histEt=[]; histEd=[]; simTime=0; }

  // ── Controles ──
  function buildControls() {
    const row = document.getElementById('ctrlrow');
    row.innerHTML = '';
    for (let i = 0; i < N; i++) {
      if (i > 0) { const s = document.createElement('div'); s.className='vsep'; row.appendChild(s); }
      const d = document.createElement('div'); d.className = 'bctl';
      const sw = document.createElement('div');
      sw.style.cssText = `width:12px;height:12px;border-radius:50%;background:${ALL_COLORS[i]};flex-shrink:0`;
      d.appendChild(sw);
      const lbl = document.createElement('div'); lbl.className='lbl';
      lbl.textContent = ALL_NAMES[i]; d.appendChild(lbl);
      const si = document.createElement('input');
      si.type='range'; si.min=MIN_R; si.max=MAX_R; si.value=RADII[i]; si.step=1;
      si.style.accentColor = ALL_COLORS[i];
      si.addEventListener('input', function() {
        if (run) return;
        RADII[i] = parseInt(this.value);
        ps[i].mass = Math.pow(RADII[i] / 28, 3);
        draw();
      });
      d.appendChild(si);
      const sl2 = document.createElement('div'); sl2.className='lbl';
      sl2.textContent = 'Tamaño'; d.appendChild(sl2);
      row.appendChild(d);
    }
    document.getElementById('noFric').addEventListener('change', function() {
      ps.forEach(p => p.noFric = this.checked);
    });
  }

  // Selector de N
  document.getElementById('nMinus').addEventListener('click', () => { if (!run && N > MIN_N) { N--; rebuild(); } });
  document.getElementById('nPlus').addEventListener('click',  () => { if (!run && N < MAX_N) { N++; rebuild(); } });

  function rebuild() {
    document.getElementById('nDisplay').textContent = N;
    buildControls();
    ps = mk();
    resetHist();
    draw(); drawGraph();
  }

  buildControls();
  ps = mk();
  resetHist();

  // ── Posición de bola ──
  function ballPos(p, i) {
    const bxArr = calcBX();
    return [bxArr[i] + STR_LEN * Math.sin(p.theta), ANCH_Y + STR_LEN * Math.cos(p.theta)];
  }

  // ── DRAG FIX ──
  // Cada bola del grupo tiene su propio ancla X (bxArr[j]).
  // El ángulo se calcula para CADA bola usando SU ancla, no la de la bola arrastrada.
  // La bola seleccionada sigue al cursor directamente, y las demás del grupo
  // heredan el mismo ángulo (que es correcto porque comparten el movimiento conjunto).
  let dragging = -1, dragGroup = [];

  function pointerThetaForBall(clientX, ballIdx) {
    const rect = cv.getBoundingClientRect();
    const scaleX = W / rect.width;
    const px = (clientX - rect.left) * scaleX;
    const bxArr = calcBX();
    const dx = px - bxArr[ballIdx];
    // Permitir arrastrar en AMBAS direcciones
    const raw = Math.asin(Math.max(-0.98, Math.min(0.98, dx / STR_LEN)));
    return raw;
  }

  function onDown(e) {
    if (run) return;
    const rect = cv.getBoundingClientRect();
    const scaleX = W / rect.width, scaleY = H / rect.height;
    const cx2 = (e.clientX ?? e.touches?.[0].clientX) - rect.left;
    const cy2 = (e.clientY ?? e.touches?.[0].clientY) - rect.top;
    const cpx = cx2 * scaleX, cpy = cy2 * scaleY;
    for (let i = 0; i < N; i++) {
      const [bx, by] = ballPos(ps[i], i);
      if (Math.sqrt((cpx - bx) ** 2 + (cpy - by) ** 2) < RADII[i] + 8) {
        dragging = i;
        // El grupo que se arrastra depende de la dirección:
        // - Si se jala la bola i hacia la izquierda (theta negativo), se arrastra i y menores (0..i)
        // - Si se jala hacia la derecha (theta positivo), se arrastra i y mayores (i..N-1)
        // Lo determinamos dinámicamente en onMove según el signo del ángulo.
        dragGroup = [i]; // inicialmente solo la bola clickeada
        cv.classList.add('dragging');
        break;
      }
    }
  }

  function onMove(e) {
    if (dragging < 0) return;
    e.preventDefault();
    const cx2 = e.clientX ?? e.touches?.[0].clientX;
    // Calcular ángulo usando el ancla de la bola arrastrada
    const theta = pointerThetaForBall(cx2, dragging);

    // Determinar grupo según dirección del arrastre
    if (theta < -0.005) {
      // Jalar izquierda: grupo son bolas 0..dragging
      dragGroup = [];
      for (let j = 0; j <= dragging; j++) dragGroup.push(j);
    } else if (theta > 0.005) {
      // Jalar derecha: grupo son bolas dragging..N-1
      dragGroup = [];
      for (let j = dragging; j < N; j++) dragGroup.push(j);
    } else {
      dragGroup = [dragging];
    }

    // Aplicar ángulo a cada bola del grupo usando SU propio ancla
    // Para que todas queden físicamente alineadas, usamos el mismo theta
    // (las bolas cuelgan del mismo punto relativo, solo cambia su ancla X)
    dragGroup.forEach(j => {
      ps[j].theta = theta;
      ps[j].omega = 0;
    });

    // Las bolas fuera del grupo vuelven a theta=0
    for (let j = 0; j < N; j++) {
      if (!dragGroup.includes(j)) {
        ps[j].theta = 0;
        ps[j].omega = 0;
      }
    }

    draw();
  }

  function onUp() { dragging = -1; dragGroup = []; cv.classList.remove('dragging'); }

  cv.addEventListener('mousedown', onDown);
  cv.addEventListener('mousemove', onMove);
  cv.addEventListener('mouseup',   onUp);
  cv.addEventListener('mouseleave',onUp);
  cv.addEventListener('touchstart', e => { e.preventDefault(); onDown(e); }, {passive: false});
  cv.addEventListener('touchmove',  e => { e.preventDefault(); onMove(e); }, {passive: false});
  cv.addEventListener('touchend', onUp);

  // ── Física ──
  function phys(p, dt) {
    if (p.stopped) return;
    if (p.collCD > 0) p.collCD -= dt;
    const fr = p.noFric ? 0 : p.friction;
    const ek0 = 0.5 * p.mass * SL * SL * p.omega * p.omega;
    const ep0 = p.mass * G_PHYS * SL * (1 - Math.cos(p.theta));
    const a = -(G_PHYS / SL) * Math.sin(p.theta) - 2 * fr * p.omega;
    p.omega += a * dt; p.theta += p.omega * dt; p.time += dt;
    const ek1 = 0.5 * p.mass * SL * SL * p.omega * p.omega;
    const ep1 = p.mass * G_PHYS * SL * (1 - Math.cos(p.theta));
    const dE = (ek1 + ep1) - (ek0 + ep0);
    if (dE < 0) p.ediss += Math.abs(dE);
    if (Math.abs(p.theta) < ST && Math.abs(p.omega) < SO && p.time > 0.3) {
      p.theta = 0; p.omega = 0; p.stopped = true; p.stoppedTime = p.time;
    }
  }

  function checkCol() {
    const bxArr = calcBX();
    for (let i = 0; i < N - 1; i++) {
      const pi = ps[i], pj = ps[i + 1];
      if (pi.collCD > 0 || pj.collCD > 0) continue;
      const [xi, yi] = ballPos(pi, i);
      const [xj, yj] = ballPos(pj, i + 1);
      const dx = xj - xi, dy = yj - yi;
      const d = Math.sqrt(dx * dx + dy * dy);
      const minD = RADII[i] + RADII[i + 1];
      if (d < minD - 0.5) {
        const vi = SL * pi.omega * Math.cos(pi.theta);
        const vj = SL * pj.omega * Math.cos(pj.theta);
        const m1 = pi.mass, m2 = pj.mass, mt = m1 + m2;
        const vi2 = ((m1 - m2) * vi + 2 * m2 * vj) / mt;
        const vj2 = ((m2 - m1) * vj + 2 * m1 * vi) / mt;
        pi.omega = vi2 / SL; pj.omega = vj2 / SL;
        if (pi.stopped && Math.abs(pi.omega) > SO) { pi.stopped = false; pi.stoppedTime = null; }
        if (pj.stopped && Math.abs(pj.omega) > SO) { pj.stopped = false; pj.stoppedTime = null; }
        const ov = minD - d + 0.5, nx = dx / d;
        pi.theta -= ov * 0.5 * nx / STR_LEN;
        pj.theta += ov * 0.5 * nx / STR_LEN;
        pi.collCD = 0.05; pj.collCD = 0.05;
      }
    }
  }

  function sysE() {
    let ek = 0, ep = 0, ed = 0;
    ps.forEach(p => {
      ek += 0.5 * p.mass * SL * SL * p.omega * p.omega;
      ep += p.mass * G_PHYS * SL * (1 - Math.cos(p.theta));
      ed += p.ediss;
    });
    return {ek, ep, et: ek + ep, ed};
  }

  function recE() {
    const {ek, ep, et, ed} = sysE();
    const last = histTime.length ? histTime[histTime.length - 1] : -1;
    if (simTime - last >= 0.04) {
      histTime.push(+simTime.toFixed(3));
      histEk.push(+ek.toFixed(5)); histEp.push(+ep.toFixed(5));
      histEt.push(+et.toFixed(5)); histEd.push(+ed.toFixed(5));
    }
  }

  // ── Dibujo ──
  function drawGrid() {
    const CELL = 28;
    ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 0.5;
    for (let x = 0; x <= W; x += CELL) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += CELL) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  }

  function drawFrame(bxArr) {
    const fL = bxArr[0] - RADII[0] - 28;
    const fR = bxArr[N - 1] + RADII[N - 1] + 28;
    // Barra trasera
    ctx.fillStyle = '#2a2a4a';
    ctx.beginPath(); ctx.roundRect(fL, BAR_BACK_Y, fR - fL, BAR_H, 3); ctx.fill();
    // Barra delantera
    ctx.fillStyle = '#3a3a6a';
    ctx.beginPath(); ctx.roundRect(fL, BAR_FRONT_Y, fR - fL, BAR_H, 3); ctx.fill();
    // Línea brillante en la barra
    ctx.fillStyle = 'rgba(150,150,255,0.18)';
    ctx.beginPath(); ctx.roundRect(fL + 2, BAR_FRONT_Y + 1, fR - fL - 4, 3, 2); ctx.fill();
    // Pilares
    ctx.fillStyle = '#2a2a4a';
    ctx.beginPath(); ctx.roundRect(fL - 2, BAR_BACK_Y, 8, H - BAR_BACK_Y - 14, 3); ctx.fill();
    ctx.beginPath(); ctx.roundRect(fR - 6, BAR_BACK_Y, 8, H - BAR_BACK_Y - 14, 3); ctx.fill();
    // Base
    ctx.beginPath(); ctx.roundRect(fL - 12, H - 14, fR - fL + 24, 8, 3); ctx.fill();
  }

  function drawStrings(p, i, bxArr) {
    const [bx, by] = ballPos(p, i);
    const axL = bxArr[i] - V_HALF, ayL = BAR_BACK_Y + BAR_H;
    const axR = bxArr[i] + V_HALF, ayR = BAR_FRONT_Y + BAR_H;
    ctx.beginPath(); ctx.moveTo(axL, ayL); ctx.lineTo(bx - 3, by - RADII[i] + 2);
    ctx.strokeStyle = 'rgba(180,180,255,0.30)'; ctx.lineWidth = 1.2; ctx.lineCap = 'round'; ctx.stroke();
    ctx.beginPath(); ctx.arc(axL, ayL, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(180,180,255,0.25)'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(axR, ayR); ctx.lineTo(bx + 3, by - RADII[i] + 2);
    ctx.strokeStyle = 'rgba(200,200,255,0.50)'; ctx.lineWidth = 1.4; ctx.lineCap = 'round'; ctx.stroke();
    ctx.beginPath(); ctx.arc(axR, ayR, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(200,200,255,0.40)'; ctx.fill();
  }

  function drawBall(bx, by, color, i) {
    const r = RADII[i];
    // Sombra en suelo
    ctx.beginPath(); ctx.ellipse(bx, REST_Y + 6, r * 0.7, 4, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fill();
    // Glow
    const glow = ctx.createRadialGradient(bx, by, r * 0.2, bx, by, r * 1.5);
    glow.addColorStop(0, color + '30'); glow.addColorStop(1, 'transparent');
    ctx.beginPath(); ctx.arc(bx, by, r * 1.5, 0, Math.PI * 2);
    ctx.fillStyle = glow; ctx.fill();
    // Cuerpo con gradiente
    const grad = ctx.createRadialGradient(bx - r * 0.3, by - r * 0.3, r * 0.1, bx, by, r);
    grad.addColorStop(0, lighten(color, 60)); grad.addColorStop(1, darken(color, 40));
    ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2);
    ctx.fillStyle = grad; ctx.fill();
    // Borde
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1.5; ctx.stroke();
    // Reflejo superior
    ctx.beginPath(); ctx.ellipse(bx - r * 0.28, by - r * 0.30, r * 0.36, r * 0.26, Math.PI / 5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fill();
    // Reflejo secundario
    ctx.beginPath(); ctx.ellipse(bx + r * 0.28, by + r * 0.28, r * 0.18, r * 0.13, Math.PI / 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fill();
    // Ángulo al arrastrar
    if (!run && Math.abs(ps[i].theta) > 0.02) {
      ctx.font = `600 ${Math.max(10, r * 0.40) | 0}px var(--font, system-ui)`;
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(Math.round(Math.abs(ps[i].theta) * (180 / Math.PI)) + '°', bx, by);
    }
  }

  // Helpers de color
  function lighten(hex, amt) { return shiftColor(hex, amt); }
  function darken(hex, amt)  { return shiftColor(hex, -amt); }
  function shiftColor(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = Math.min(255, Math.max(0, (n >> 16) + amt));
    let g = Math.min(255, Math.max(0, ((n >> 8) & 0xff) + amt));
    let b = Math.min(255, Math.max(0, (n & 0xff) + amt));
    return `rgb(${r},${g},${b})`;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // Fondo oscuro con gradiente
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#1e2240'); bg.addColorStop(1, '#141830');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    drawGrid();
    const bxArr = calcBX();
    drawFrame(bxArr);
    ps.forEach((p, i) => drawStrings(p, i, bxArr));
    ps.forEach((p, i) => { const [bx, by] = ballPos(p, i); drawBall(bx, by, ALL_COLORS[i], i); });
    if (!run) {
      ctx.font = '11px var(--font, system-ui)';
      ctx.fillStyle = 'rgba(255,255,255,0.30)';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('Arrastra cualquier bola en cualquier dirección para elevarla', W / 2, H - 8);
    }
  }

  function drawGraph() {
    const cw = GC.width, ch = GC.height;
    const PAD = {t: 8, r: 12, b: 22, l: 48};
    const pw = cw - PAD.l - PAD.r, ph = ch - PAD.t - PAD.b;
    gctx.clearRect(0, 0, cw, ch);
    gctx.fillStyle = '#0f1428'; gctx.fillRect(0, 0, cw, ch);
    if (histTime.length < 2) {
      gctx.fillStyle = 'rgba(255,255,255,0.25)'; gctx.font = '12px system-ui';
      gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
      gctx.fillText('Arrastra una bola e inicia la simulación', cw / 2, ch / 2); return;
    }
    const maxT = histTime[histTime.length - 1];
    const maxE = Math.max(...histEt, ...histEd) * 1.1 || 1;
    gctx.strokeStyle = 'rgba(255,255,255,0.06)'; gctx.lineWidth = 1;
    for (let g = 0; g <= 4; g++) {
      const y = PAD.t + ph * (1 - g / 4);
      gctx.beginPath(); gctx.moveTo(PAD.l, y); gctx.lineTo(PAD.l + pw, y); gctx.stroke();
      gctx.fillStyle = 'rgba(255,255,255,0.35)';
      gctx.font = '9px system-ui'; gctx.textAlign = 'right'; gctx.textBaseline = 'middle';
      gctx.fillText((maxE * g / 4).toFixed(3) + 'J', PAD.l - 4, y);
    }
    const tx = t => PAD.l + (t / maxT) * pw;
    const ty = e => PAD.t + ph * (1 - Math.min(e / maxE, 1.05));
    function dl(arr, col, lw) {
      if (!arr.length) return;
      gctx.beginPath(); gctx.strokeStyle = col; gctx.lineWidth = lw; gctx.lineJoin = 'round';
      arr.forEach((v, j) => j === 0 ? gctx.moveTo(tx(histTime[j]), ty(v)) : gctx.lineTo(tx(histTime[j]), ty(v)));
      gctx.stroke();
    }
    dl(histEd, '#94a3b8', 1.4); dl(histEp, '#60a5fa', 1.8); dl(histEk, '#f59e0b', 1.8); dl(histEt, '#a78bfa', 2.2);
    gctx.fillStyle = 'rgba(255,255,255,0.30)'; gctx.font = '9px system-ui';
    gctx.textAlign = 'center'; gctx.textBaseline = 'top';
    for (let ti = 0; ti <= 5; ti++) {
      const t = maxT * ti / 5;
      gctx.fillText(t.toFixed(1) + 's', tx(t), PAD.t + ph + 4);
    }
  }

  // ── Loop ──
  const SUB = 12;
  function loop(ts) {
    if (!run) return;
    if (!lts) lts = ts;
    const rdt = Math.min((ts - lts) / 1000, 0.05); lts = ts;
    const s = parseFloat(document.getElementById('spd').value);
    const dt = (rdt * s) / SUB;
    for (let k = 0; k < SUB; k++) { ps.forEach(p => phys(p, dt)); checkCol(); }
    simTime += rdt * s;
    recE(); draw(); drawGraph();
    if (ps.every(p => p.stopped)) {
      run = false; document.getElementById('startBtn').textContent = 'Completado'; return;
    }
    aid = requestAnimationFrame(loop);
  }

  window.simStart = function() {
    if (run) return;
    if (ps.every(p => Math.abs(p.theta) < 0.01)) ps[0].theta = -0.65;

    // Detectar qué bolas están elevadas (tienen ángulo) y cuáles están en reposo
    // Las bolas en reposo adyacentes al grupo elevado reciben collCD para no
    // bloquear inmediatamente al grupo que cae — esto evita que la bola
    // seleccionada quede atrapada al inicio por colisión prematura
    const elevated = ps.map((p, i) => Math.abs(p.theta) > 0.01);

    ps.forEach((p, i) => {
      p.omega = 0;
      p.stopped = false;
      p.stoppedTime = null;
      p.time = 0;
      p.ediss = 0;
      // Si está en reposo y tiene una bola elevada adyacente,
      // añadir cooldown para que no colisione antes de que se separen
      const leftElevated  = i > 0     && elevated[i - 1];
      const rightElevated = i < N - 1 && elevated[i + 1];
      if (elevated[i]) {
        p.collCD = 0; // la bola elevada empieza sin cooldown
      } else {
        p.collCD = (leftElevated || rightElevated) ? 0.12 : 0;
      }
    });

    // Si el grupo elevado tiene theta positivo (jalado a la derecha),
    // desplazar ligeramente las bolas en reposo a la izquierda
    // para evitar overlap inmediato al inicio
    const rightGroup = ps.some(p => p.theta > 0.01);
    if (rightGroup) {
      ps.forEach((p, i) => {
        if (!elevated[i]) {
          // Pequeño desplazamiento hacia la izquierda
          p.theta = -0.04;
        }
      });
    }

    resetHist(); run = true; lts = null;
    document.getElementById('startBtn').textContent = 'Corriendo...';
    aid = requestAnimationFrame(loop);
  };

  window.simReset = function() {
    run = false; if (aid) cancelAnimationFrame(aid); lts = null;
    ps = mk(); resetHist();
    document.getElementById('startBtn').textContent = '▶ Iniciar';
    draw(); drawGraph();
  };

  window.exportExcel = function() {
    if (!window.XLSX) { alert('Librería no disponible'); return; }
    const wb = XLSX.utils.book_new();
    const hdr = ['Tiempo (s)','Ec total (J)','Ep total (J)','Et total (J)','Edisipada acum. (J)'];
    const rows = histTime.map((t, j) => [t, histEk[j], histEp[j], histEt[j], histEd[j]]);
    const ws = XLSX.utils.aoa_to_sheet([
      ['Péndulo de Newton — Energía del sistema'],
      [`Bolas: ${N} | Fricción individual por bola`], [], hdr, ...rows
    ]);
    ws['!cols'] = [{wch:12},{wch:16},{wch:16},{wch:16},{wch:20}];
    ws['!merges'] = [{s:{r:0,c:0},e:{r:0,c:4}},{s:{r:1,c:0},e:{r:1,c:4}}];
    XLSX.utils.book_append_sheet(wb, ws, 'Energía');
    XLSX.writeFile(wb, 'pendulo_newton.xlsx');
  };

  draw(); drawGraph();
})();
</script>
